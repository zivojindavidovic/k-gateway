spring.application.name=kancelarko-api-gateway
server.port=9090

spring.cloud.gateway.server.webflux.routes[0].id=adresar
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:9091
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/adresar/**

spring.cloud.gateway.server.webflux.routes[1].id=delovodnik
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:9092
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/delovodnik/**