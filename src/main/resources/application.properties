spring.application.name=kancelarko-api-gateway
server.port=9090
# Iza nginx-a: sema i host zahteva iz Host i X-Forwarded-* zaglavlja.
server.forward-headers-strategy=framework

# k-auth (IdP)
kancelarko.auth.issuer=${K_AUTH_ISSUER:http://auth.kancelarko.local}
kancelarko.auth.client.id=${K_GATEWAY_CLIENT_ID:k-gateway}
kancelarko.auth.client.secret=${K_GATEWAY_CLIENT_SECRET:}
kancelarko.auth.clock-skew=60s
kancelarko.auth.revocation.redis-database=${K_AUTH_REDIS_DB:2}
kancelarko.auth.revocation.key-prefix=${K_AUTH_REDIS_PREFIX:k-auth:}
kancelarko.auth.revocation.fail-open=true

# Aplikacije su na poddomenima parent-domain; prijava i odjava se zavrsavaju na public-url.
kancelarko.gateway.parent-domain=${K_GATEWAY_PARENT_DOMAIN:kancelarko.local}
kancelarko.gateway.public-url=${K_GATEWAY_PUBLIC_URL:http://gateway.kancelarko.local}
kancelarko.gateway.home-url=${K_GATEWAY_HOME_URL:http://fakture.kancelarko.local/}

# Redis: sesije gateway-a (DB 0-2 koristi k-auth)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${K_GATEWAY_REDIS_DB:3}
spring.session.redis.namespace=k-gateway:session
server.reactive.session.timeout=8h
server.reactive.session.cookie.name=K_GATEWAY_SESSION
server.reactive.session.cookie.domain=${kancelarko.gateway.parent-domain}
server.reactive.session.cookie.http-only=true
server.reactive.session.cookie.same-site=lax
server.reactive.session.cookie.secure=${K_GATEWAY_COOKIE_SECURE:false}

# Rute: metadata.audiences = klijenti (aud tokena) koji smeju na rutu; metadata.public = bez prijave.
# Filteri aplikacija: token iz sesije ide kao Bearer (Bearer od klijenta prolazi kakav jeste),
# osvezeni tokeni se cuvaju u sesiji pre prosledjivanja.

# Javni kljucevi k-auth-a, da aplikacije proveravaju tokene bez veze sa k-auth-om.
spring.cloud.gateway.server.webflux.routes[0].id=jwks
spring.cloud.gateway.server.webflux.routes[0].uri=${kancelarko.auth.issuer}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/.well-known/jwks.json
spring.cloud.gateway.server.webflux.routes[0].metadata.public=true

spring.cloud.gateway.server.webflux.routes[1].id=adresar
spring.cloud.gateway.server.webflux.routes[1].uri=${K_ADRESAR_URI:http://localhost:9091}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/adresar/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=TokenRelay=
spring.cloud.gateway.server.webflux.routes[1].filters[1]=SaveSession
spring.cloud.gateway.server.webflux.routes[1].metadata.audiences=k-gateway

spring.cloud.gateway.server.webflux.routes[2].id=delovodnik
spring.cloud.gateway.server.webflux.routes[2].uri=${K_DELOVODNIK_URI:http://localhost:9092}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/delovodnik/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=TokenRelay=
spring.cloud.gateway.server.webflux.routes[2].filters[1]=SaveSession
spring.cloud.gateway.server.webflux.routes[2].metadata.audiences=k-gateway

# Aplikacija po hostu: ceo sajt (stranice, asset-i, XHR) ide kroz gateway; Host se cuva,
# da aplikacija pravi linkove na svoj javni domen. Sablon za svaku novu aplikaciju.
spring.cloud.gateway.server.webflux.routes[3].id=fakture
spring.cloud.gateway.server.webflux.routes[3].uri=${K_FAKTURE_URI:http://localhost:9180}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Host=fakture.${kancelarko.gateway.parent-domain}
spring.cloud.gateway.server.webflux.routes[3].filters[0]=TokenRelay=
spring.cloud.gateway.server.webflux.routes[3].filters[1]=SaveSession
spring.cloud.gateway.server.webflux.routes[3].filters[2]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[3].metadata.audiences=k-gateway
